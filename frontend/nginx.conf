server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Teruskan /api ke backend (service bernama "backend" di compose).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket realtime /ws?token=... — tanpa blok ini permintaan jatuh ke
    # SPA di bawah, handshake gagal, dan klien reconnect loop selamanya.
    location = /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Koneksi idle tidak boleh diputus proxy (default nginx 60 detik);
        # ping WS tiap 20 detik juga me-reset timer ini.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA React: route selain file statis jatuh ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
