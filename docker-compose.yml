# Untuk deployment di mesin lain (bukan untuk dijalankan di sini).
# Database TIDAK didefinisikan di sini: pakai container yang sudah jalan,
# telegram-whitelist-db (postgres:16) di host 127.0.0.1:5433.
# Backend mencapainya lewat host.docker.internal:5433.

services:
  backend:
    build: ./backend
    container_name: webchat-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://Faizal:Faizal291093@telegram-whitelist-db:5432/telegram_access
    networks:
      - default
      - n8n_default
    ports:
      - "456:8000"

  frontend:
    build: ./frontend
    container_name: webchat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "323:80"

networks:
  n8n_default:
    external: true
    name: n8n_default
